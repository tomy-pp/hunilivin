<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Villa · Hunilivin</title>
<meta name="description" content="Villa details — photos, amenities and location. Book your Bali stay with Hunilivin via WhatsApp." />
<link rel="icon" href="logo-trim.png" />
<link rel="apple-touch-icon" href="logo-trim.png" />
<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,400;9..144,500;9..144,600;9..144,700&family=Jost:wght@300;400;500;600&display=swap" rel="stylesheet">
<style>
  :root{--sand:#f5f4f2;--ink:#161616;--green:#1a1a1a;--gold:#8f8f8f;--muted:#8a8a8a;
    --line:#e4e4e2;--avail:#2e8b57;--booked:#8a8a8a;--soon:#e0a92e}
  *{box-sizing:border-box;margin:0;padding:0}
  body{font-family:'Jost',-apple-system,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;color:var(--ink);
    background:var(--sand);line-height:1.55;-webkit-font-smoothing:antialiased}
  h1,h2,h3{font-family:'Fraunces',Georgia,serif;font-weight:600;letter-spacing:-.015em}
  .wrap{max-width:1120px;margin:0 auto;padding:0 24px}
  a{color:inherit}

  header{position:sticky;top:0;z-index:1000;background:rgba(246,241,231,.92);backdrop-filter:blur(8px);border-bottom:1px solid var(--line)}
  .nav{display:flex;align-items:center;gap:18px;height:112px}
  .logo{display:flex;align-items:center;text-decoration:none}
  .logo img{height:98px;width:auto;display:block}
  footer .logo img{height:84px;filter:brightness(0) invert(1)}
  .nav .right{margin-left:auto;display:flex;align-items:center;gap:10px}
  .toggle{display:inline-flex;border:1px solid var(--line);border-radius:20px;overflow:hidden;background:#fff}
  .toggle button{border:0;background:transparent;padding:6px 11px;font-size:13px;cursor:pointer;color:var(--muted)}
  .toggle button.on{background:var(--green);color:#fff}

  .back{display:inline-block;margin:22px 0 6px;font-size:14px;color:var(--muted);text-decoration:none}
  .back:hover{color:var(--green)}

  .top{display:grid;grid-template-columns:1.35fr 1fr;gap:34px;margin-top:8px;align-items:start}
  .top>div{min-width:0}
  .stage{max-height:78vh}

  /* gallery */
  .gallery{border-radius:16px;overflow:hidden;background:#000;position:relative}
  .stage{position:relative;aspect-ratio:4/3;background:#ddd}
  .stage img{width:100%;height:100%;object-fit:cover;display:block;user-select:none}
  .arrow{position:absolute;top:50%;transform:translateY(-50%);width:44px;height:44px;border:0;border-radius:50%;
    background:rgba(255,255,255,.9);cursor:pointer;font-size:18px;color:var(--ink);display:flex;align-items:center;
    justify-content:center;box-shadow:0 3px 10px rgba(0,0,0,.25);transition:background .15s,transform .15s}
  .arrow:hover{background:#fff;transform:translateY(-50%) scale(1.08)}
  .arrow.prev{left:14px} .arrow.next{right:14px}
  .counter{position:absolute;bottom:12px;right:14px;background:rgba(0,0,0,.55);color:#fff;font-size:12px;
    padding:4px 10px;border-radius:20px}
  .thumbs{display:flex;gap:10px;padding:12px;background:#fff}
  .thumbs img{width:76px;height:56px;object-fit:cover;border-radius:8px;cursor:pointer;opacity:.55;
    border:2px solid transparent;transition:opacity .15s}
  .thumbs img.on{opacity:1;border-color:var(--gold)}

  /* info panel */
  .panel{position:sticky;top:124px}
  .badge{display:inline-flex;align-items:center;gap:7px;font-size:13px;font-weight:700;border-radius:20px;
    padding:5px 12px;background:#fff;border:1px solid var(--line)}
  .badge .dot{width:8px;height:8px;border-radius:50%}
  .badge.available{color:var(--avail)} .badge.available .dot{background:var(--avail)}
  .badge.booked{color:var(--booked)} .badge.booked .dot{background:var(--booked)}
  .badge.soon{color:var(--soon)} .badge.soon .dot{background:var(--soon)}
  .panel h1{font-size:32px;color:var(--green);margin:14px 0 6px}
  .panel .loc{color:var(--muted);font-size:15px}
  .facts{display:flex;gap:18px;margin:16px 0;flex-wrap:wrap}
  .facts div{font-size:14px;color:var(--ink)}
  .facts b{font-family:'Fraunces',Georgia,serif;font-size:20px;color:var(--green);display:block}
  .price{font-family:'Fraunces',Georgia,serif;font-size:30px;font-weight:700;color:var(--green);margin:14px 0 2px}
  .price small{font-family:-apple-system,sans-serif;font-size:14px;color:var(--muted);font-weight:400}
  .wa{width:100%;margin-top:16px;background:#161616;color:#fff;border:0;border-radius:12px;padding:15px;
    font-size:16px;font-weight:500;letter-spacing:.02em;cursor:pointer}
  .wa.disabled{background:#e7e2d6;color:var(--muted);cursor:not-allowed}

  section.blk{padding:44px 0;border-top:1px solid var(--line)}
  .blk h2{font-size:24px;color:var(--green);margin-bottom:14px}
  .blk p{font-size:16px;color:#39423b;max-width:760px}
  .amen{display:grid;grid-template-columns:repeat(3,1fr);gap:12px;margin-top:6px}
  .amen div{background:#fff;border:1px solid var(--line);border-radius:10px;padding:12px 14px;font-size:14px;display:flex;gap:9px;align-items:center}
  .amen .ac{color:var(--ink);font-weight:700}
  #minimap{height:320px;border-radius:14px;margin-top:8px;border:1px solid var(--line)}
  .pin svg{filter:drop-shadow(0 3px 4px rgba(0,0,0,.35))}

  footer{background:var(--ink);color:#b3b3b3;padding:30px 0;font-size:13px;margin-top:30px}
  footer .fx{display:flex;justify-content:space-between;flex-wrap:wrap;gap:12px}
  footer .logo{color:#fff}

  @media(max-width:820px){
    .top{grid-template-columns:1fr}
    .panel{position:static}
    .amen{grid-template-columns:1fr 1fr}
  }
</style>
</head>
<body>

<header>
  <div class="wrap nav">
    <a href="index.html" class="logo"><img src="logo-trim.png" alt="Hunilivin" /></a>
    <div class="right">
      <div class="toggle" id="lang"><button data-lang="en" class="on">EN</button><button data-lang="id">ID</button></div>
      <div class="toggle" id="cur"><button data-cur="IDR" class="on">IDR</button><button data-cur="USD">USD</button></div>
    </div>
  </div>
</header>

<div class="wrap">
  <a href="index.html" class="back" data-t="back">← Back to all villas</a>

  <div class="top">
    <div>
      <div class="gallery">
        <div class="stage">
          <img id="mainimg" src="" alt="" />
          <button class="arrow prev" onclick="nav(-1)">◀</button>
          <button class="arrow next" onclick="nav(1)">▶</button>
          <div class="counter"><span id="cnow">1</span> / <span id="ctot">1</span></div>
        </div>
        <div class="thumbs" id="thumbs"></div>
      </div>
    </div>

    <div class="panel">
      <span class="badge" id="badge"><span class="dot"></span><span id="stlabel"></span></span>
      <h1 id="vname"></h1>
      <div class="loc" id="vloc"></div>
      <div class="loc" id="vnear" style="margin-top:2px"></div>
      <div class="facts" id="facts"></div>
      <div class="price" id="price"></div>
      <div class="loc" id="vterms" style="margin-top:2px;font-weight:700;color:var(--ink)"></div>
      <div class="loc" id="vterms-note" style="margin-top:1px;font-weight:700"></div>
      <button class="wa" id="wabtn"></button>
    </div>
  </div>

  <section class="blk">
    <h2 data-t="about_villa">About this villa</h2>
    <p id="desc"></p>
  </section>

  <section class="blk">
    <h2 data-t="amenities">Amenities</h2>
    <div class="amen" id="amen"></div>
  </section>

  <section class="blk">
    <h2 data-t="location">Location</h2>
    <div id="minimap"></div>
  </section>
</div>

<footer><div class="wrap fx">
  <div class="logo"><img src="logo-trim.png" alt="Hunilivin" /></div>
  <div>© 2026 Hunilivin · Villa management, Bali</div>
</div></footer>

<script src="villas-data.js"></script>
<script>
let RATE=16000;
const villas=(window.HUNI&&HUNI.villas)?HUNI.villas:[];
const PERIOD={Daily:{en:"Daily",id:"Harian",per:{en:"/night",id:"/malam"}},Weekly:{en:"Weekly",id:"Mingguan",per:{en:"/week",id:"/minggu"}},Monthly:{en:"Monthly",id:"Bulanan",per:{en:"/month",id:"/bulan"}},Yearly:{en:"Yearly",id:"Tahunan",per:{en:"/year",id:"/tahun"}}};
const ST={available:{en:"Available",id:"Tersedia"},booked:{en:"Booked",id:"Terisi"},soon:{en:"Coming soon",id:"Segera hadir"}};
const T={
  back:{en:"← Back to all villas",id:"← Kembali ke semua villa"},
  about_villa:{en:"About this villa",id:"Tentang villa ini"},
  amenities:{en:"Amenities",id:"Fasilitas"},
  location:{en:"Location",id:"Lokasi"},
};

const _pid=new URLSearchParams(location.search).get("id");
const v=villas.find(x=>x.id===_pid)||villas[0]||{};
const gallery=(v.photos&&v.photos.length)?v.photos:[""];
let lang="en", cur="IDR", gi=0;

function fmtPrice(idr, sub){
  sub = sub || (lang==="en"?"/night":"/malam");
  if(!idr) return {m:(lang==="en"?"Coming soon":"Segera hadir"),s:""};
  if(cur==="IDR") return {m:"Rp"+idr.toLocaleString("id-ID"),s:sub};
  return {m:"$"+Math.round(idr/RATE).toLocaleString("en-US"),s:sub};
}
function showImg(){
  document.getElementById("mainimg").src=gallery[gi];
  document.getElementById("cnow").textContent=gi+1;
  document.querySelectorAll("#thumbs img").forEach((t,i)=>t.classList.toggle("on",i===gi));
}
function nav(d){ gi=(gi+d+gallery.length)%gallery.length; showImg(); }
window.nav=nav;

function render(){
  document.title=v.name+" · Hunilivin";
  document.querySelectorAll("[data-t]").forEach(el=>{const k=el.getAttribute("data-t");if(T[k])el.textContent=T[k][lang];});
  document.documentElement.lang=lang;
  document.getElementById("vname").textContent=v.name;
  document.getElementById("vloc").textContent=v.area+", Bali";
  document.getElementById("vnear").textContent=lang==="en"
    ? `${v.near[0]} min to beach · ${v.near[1]} min from airport`
    : `${v.near[0]} mnt ke pantai · ${v.near[1]} mnt dari bandara`;
  const badge=document.getElementById("badge"); badge.className="badge "+v.status;
  document.getElementById("stlabel").textContent=ST[v.status][lang];
  document.getElementById("facts").innerHTML=
    `<div><b>${v.br}</b>${lang==="en"?"Bedrooms":"Kamar tidur"}</div>
     <div><b>${v.ba}</b>${lang==="en"?"Bathrooms":"Kamar mandi"}</div>
     <div><b>${Math.max((parseInt(v.br)||1)*2,2)}</b>${lang==="en"?"Guests":"Tamu"}</div>`;
  const unit=v.terms[0];
  const p=fmtPrice(v.price, (PERIOD[unit]?PERIOD[unit].per[lang]:("/"+String(unit||"").toLowerCase())));
  document.getElementById("price").innerHTML=v.status==="booked" ? "" : `${p.m} <small>${p.s}</small>`;
  document.getElementById("vterms").textContent=(lang==="en"?"Rental: ":"Sewa: ")+v.terms.map(x=>(PERIOD[x]?PERIOD[x][lang]:x)).join(" · ");
  document.getElementById("vterms-note").textContent=v.terms.length>1
    ? (lang==="en"?"Other durations — message us on WhatsApp for rates.":"Harga durasi lain — hubungi admin via WhatsApp.")
    : "";
  const wa=document.getElementById("wabtn");
  const PHONE="628993000157";
  let label, msg;
  if(v.status==="booked"){
    label=lang==="en"?"Ask availability":"Tanya ketersediaan";
    msg=lang==="en"?`Hi Hunilivin, is ${v.name} available for other dates?`:`Halo Hunilivin, apakah ${v.name} tersedia untuk tanggal lain?`;
  } else if(v.status==="soon"){
    label=lang==="en"?"Notify me when available":"Beri tahu saat tersedia";
    msg=lang==="en"?`Hi Hunilivin, please notify me when ${v.name} is available.`:`Halo Hunilivin, tolong beri tahu saya saat ${v.name} tersedia.`;
  } else {
    label=lang==="en"?"Enquire on WhatsApp":"Tanya via WhatsApp";
    msg=lang==="en"?`Hi Hunilivin, I'm interested in ${v.name}. Is it available?`:`Halo Hunilivin, saya tertarik dengan ${v.name}. Apakah tersedia?`;
  }
  wa.className="wa"; wa.textContent=label;
  wa.onclick=()=>{const url=`https://wa.me/${PHONE}?text=${encodeURIComponent(msg)}`;const w=window.open(url,"_blank");if(!w)window.location.href=url;};
  document.getElementById("desc").textContent=lang==="en"?v.d_en:v.d_id;
  document.getElementById("amen").innerHTML=(v.amenities||[]).map(a=>`<div><span class="ac">✓</span> ${a}</div>`).join("");
  document.getElementById("ctot").textContent=gallery.length;
}

// thumbnails
document.getElementById("thumbs").innerHTML=gallery.map((g,i)=>`<img src="${g}" onclick="gi=${i};showImg()" alt=""/>`).join("");
window.gi=gi; window.showImg=showImg;

// mini map
const mmap=L.map("minimap",{scrollWheelZoom:false,zoomControl:true}).setView([v.lat,v.lng],14);
mmap.attributionControl.setPrefix(false);
L.tileLayer("https://api.maptiler.com/maps/basic-v2/256/{z}/{x}/{y}.png?key=fS5rVa6Z9hrGqm1GCuHM",{
  attribution:'&copy; MapTiler &copy; OpenStreetMap',maxZoom:20,crossOrigin:true}).addTo(mmap);
L.marker([v.lat,v.lng],{icon:L.divIcon({className:"pin",iconSize:[30,40],iconAnchor:[15,40],
  html:`<svg width="30" height="40" viewBox="0 0 30 40"><path d="M15 0C7 0 .5 6.4.5 14.3.5 25 15 40 15 40s14.5-15 14.5-25.7C29.5 6.4 23 0 15 0z" fill="#d13b30"/><circle cx="15" cy="14.3" r="5.2" fill="#fff"/></svg>`})}).addTo(mmap);

// toggles
document.getElementById("lang").addEventListener("click",e=>{if(!e.target.dataset.lang)return;lang=e.target.dataset.lang;
  document.querySelectorAll("#lang button").forEach(b=>b.classList.toggle("on",b===e.target));render();});
document.getElementById("cur").addEventListener("click",e=>{if(!e.target.dataset.cur)return;cur=e.target.dataset.cur;
  document.querySelectorAll("#cur button").forEach(b=>b.classList.toggle("on",b===e.target));render();});

showImg(); render();

/* live exchange rate (IDR per 1 USD) — free, no key */
fetch("https://api.frankfurter.app/latest?from=USD&to=IDR")
  .then(r=>r.json())
  .then(d=>{ if(d&&d.rates&&d.rates.IDR){ RATE=d.rates.IDR; if(cur==="USD") render(); } })
  .catch(()=>{});
</script>
</body>
</html>
