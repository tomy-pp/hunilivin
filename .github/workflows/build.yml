name: Sync villas from Google Sheet

on:
  schedule:
    - cron: "*/15 * * * *"   # every ~15 minutes
  workflow_dispatch:          # manual "Run workflow" button

permissions:
  contents: write

concurrency:
  group: sync-villas
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.x"
      - name: Install Pillow (for processing photo links from the sheet)
        run: python -m pip install --quiet pillow
      - name: Rebuild villa data from the Google Sheet
        run: python3 build/build.py
      - name: Commit & deploy if changed
        run: |
          if [ -n "$(git status --porcelain)" ]; then
            git config user.name "hunilivin-bot"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add villas-data.js sitemap.xml robots.txt photos
            git commit -m "Auto-sync from Google Sheet (data + photos)"
            git push
            echo "Deployed changes."
          else
            echo "No changes."
          fi
